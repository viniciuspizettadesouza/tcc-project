[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-reconstruction"
version = "0.1.0"
description = "Evidence-based reconstruction of the TCC credit campaign notebooks"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
